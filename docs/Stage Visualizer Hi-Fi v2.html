<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stage Visualizer — Hi-Fi v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #111; font-family: 'Chakra Petch', sans-serif; }

:root {
  --bg:         #080604;
  --glass:      rgba(255,255,255,0.045);
  --glass2:     rgba(255,255,255,0.07);
  --glass-dark: rgba(8,6,4,0.65);
  --border:     rgba(220,100,30,0.20);
  --border2:    rgba(220,100,30,0.32);
  --inner-hl:   inset 0 1px 0 rgba(255,255,255,0.05);
  --ember:      #E8531A;
  --ember2:     #FF6B2B;
  --ember-dim:  rgba(232,83,26,0.15);
  --ember-glow: 0 0 14px rgba(232,83,26,0.45), 0 0 2px rgba(232,83,26,0.8);
  --cam:        #1FA0EE;
  --cam-dim:    rgba(31,160,238,0.15);
  --cam-glow:   0 0 10px rgba(31,160,238,0.35);
  --green:      #2BC782;
  --amber:      #E89518;
  --text:       #F4ECE2;
  --text2:      #C8B8A8;
  --text3:      #8E7E70;
  --text4:      #5A4E45;
  --panel-r:    10px;
  --ctrl-r:     6px;
}

.screen { font-family: 'Chakra Petch', sans-serif; background: var(--bg); overflow: hidden; position: relative; color: var(--text); }
.screen::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse 60% 40% at 15% 100%, rgba(180,50,10,0.12) 0%, transparent 60%), radial-gradient(ellipse 40% 30% at 85% 0%, rgba(31,160,238,0.05) 0%, transparent 50%); pointer-events: none; z-index: 0; }
.screen > * { position: relative; z-index: 1; }

.glass-panel { background: var(--glass-dark); backdrop-filter: blur(14px) saturate(120%); -webkit-backdrop-filter: blur(14px) saturate(120%); border: 1px solid var(--border); box-shadow: var(--inner-hl); }

.topbar { height: 44px; background: rgba(10,8,6,0.94); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; padding: 0 14px; flex-shrink: 0; backdrop-filter: blur(20px); position: relative; z-index: 10; box-shadow: 0 1px 0 rgba(255,255,255,0.03); }
.logo-mark { width: 24px; height: 24px; background: linear-gradient(135deg, var(--ember2), var(--ember)); border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: white; flex-shrink: 0; box-shadow: var(--ember-glow), inset 0 1px 0 rgba(255,255,255,0.3); letter-spacing: 0.02em; }
.topbar-divider { width: 1px; height: 22px; background: rgba(220,100,30,0.22); flex-shrink: 0; }

.btn { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: var(--ctrl-r); font-family: 'Chakra Petch', sans-serif; font-size: 11px; font-weight: 500; cursor: default; white-space: nowrap; letter-spacing: 0.02em; transition: all 0.15s; user-select: none; }
.btn-ghost { background: var(--glass); border: 1px solid rgba(220,100,30,0.22); color: var(--text2); }
.btn-ghost:hover { border-color: var(--border2); color: var(--text); background: var(--glass2); }
.btn-ember { background: linear-gradient(180deg, var(--ember2), var(--ember)); border: 1px solid var(--ember2); color: white; box-shadow: var(--ember-glow), inset 0 1px 0 rgba(255,255,255,0.25); font-weight: 600; }
.btn-ember-outline { background: var(--ember-dim); border: 1px solid var(--ember); color: var(--ember2); font-weight: 600; }
.btn-disabled { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06); color: var(--text4); cursor: not-allowed; }
.btn-cam { background: var(--cam-dim); border: 1px solid var(--cam); color: var(--cam); font-size: 10px; padding: 3px 9px; box-shadow: var(--cam-glow); font-weight: 500; }
.btn-cam-inactive { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); color: var(--text3); font-size: 10px; padding: 3px 9px; }

.tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 4px; font-size: 9px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; font-family: 'Chakra Petch', sans-serif; }
.tag-draft     { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); color: #B0A090; }
.tag-unsaved   { background: rgba(232,149,24,0.16); border: 1px solid var(--amber); color: var(--amber); }
.tag-published { background: rgba(43,199,130,0.13); border: 1px solid var(--green); color: var(--green); }
.tag-pending   { background: rgba(232,149,24,0.12); border: 1px solid rgba(232,149,24,0.55); color: var(--amber); }
.tag-resolved  { background: rgba(43,199,130,0.10); border: 1px solid rgba(43,199,130,0.45); color: var(--green); }
.tag-locked    { background: rgba(232,83,26,0.16); border: 1px solid var(--ember); color: var(--ember2); }

.section-label { font-size: 9px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text3); }

.input-field { width: 100%; background: rgba(0,0,0,0.35); border: 1px solid rgba(220,100,30,0.18); border-radius: 6px; padding: 6px 9px; font-family: 'Chakra Petch', sans-serif; font-size: 11px; color: var(--text); outline: none; line-height: 1.4; }
.input-field.focused { border-color: var(--border2); box-shadow: 0 0 0 2px rgba(232,83,26,0.12); }
.input-field.empty { color: var(--text3); }
.input-field.error { border-color: rgba(232,83,26,0.6); }

.stage-viewer { background: #050404; position: relative; overflow: hidden; flex: 1; }
.stage-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(232,83,26,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(232,83,26,0.04) 1px, transparent 1px); background-size: 40px 40px; }

.clip-thumb { background: #1a1410; border: 1px solid rgba(220,100,30,0.15); border-radius: 6px; overflow: hidden; position: relative; flex-shrink: 0; }
.clip-thumb.active { border-color: var(--ember); box-shadow: 0 0 10px rgba(232,83,26,0.3), inset 0 0 8px rgba(232,83,26,0.08); }
.clip-thumb-bg { background: repeating-linear-gradient(135deg, #1a1410 0px, #1a1410 3px, #201810 3px, #201810 9px); width: 100%; height: 100%; }

::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(220,100,30,0.25); border-radius: 2px; }

.feedback-item { background: rgba(0,0,0,0.28); border: 1px solid rgba(220,100,30,0.1); border-radius: 8px; padding: 8px 10px; cursor: default; transition: all 0.15s; }
.feedback-item:hover { border-color: var(--border2); background: rgba(0,0,0,0.4); }
.feedback-item.active { border-color: var(--ember); box-shadow: 0 0 12px rgba(232,83,26,0.15); }

.transport { height: 38px; background: rgba(5,4,3,0.95); border-top: 1px solid rgba(220,100,30,0.14); display: flex; align-items: center; gap: 10px; padding: 0 14px; flex-shrink: 0; }
.transport-track { flex: 1; height: 3px; background: rgba(255,255,255,0.1); border-radius: 2px; position: relative; }
.transport-fill { position: absolute; left: 0; top: 0; height: 100%; background: var(--ember); border-radius: 2px; box-shadow: 0 0 6px rgba(232,83,26,0.4); }
.transport-head { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 10px; height: 10px; border-radius: 50%; background: white; box-shadow: 0 0 8px rgba(232,83,26,0.9); }

.panel-header { padding: 9px 12px; border-bottom: 1px solid rgba(220,100,30,0.12); flex-shrink: 0; }

.ref-img-block { background: rgba(0,0,0,0.3); border: 1px solid rgba(220,100,30,0.2); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 9px; color: var(--text3); font-family: 'Chakra Petch', sans-serif; position: relative; overflow: hidden; }
.ref-img-block .hatch { position: absolute; inset: 0; background: repeating-linear-gradient(45deg, transparent, transparent 4px, rgba(220,100,30,0.05) 4px, rgba(220,100,30,0.05) 5px); }

.avatar { border-radius: 50%; background: linear-gradient(135deg, #B04018, #4A2010); border: 1px solid rgba(232,83,26,0.45); display: flex; align-items: center; justify-content: center; color: var(--ember2); font-size: 9px; font-weight: 700; flex-shrink: 0; }

.annot-circle { position: absolute; border: 2px dashed var(--ember); border-radius: 50%; box-shadow: 0 0 14px rgba(232,83,26,0.35), inset 0 0 8px rgba(232,83,26,0.08); pointer-events: none; }
.annot-pin { position: absolute; width: 20px; height: 20px; border-radius: 50%; background: var(--ember); border: 1.5px solid rgba(255,255,255,0.7); display: flex; align-items: center; justify-content: center; font-size: 10px; color: white; font-weight: 700; box-shadow: var(--ember-glow); z-index: 10; }

.mobile-status { height: 24px; background: #030202; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; flex-shrink: 0; }

.review-tab { padding: 5px 11px; font-size: 10px; font-weight: 500; border-radius: 5px; cursor: default; letter-spacing: 0.04em; display: inline-flex; align-items: center; gap: 5px; }
.review-tab.active { background: var(--ember-dim); border: 1px solid var(--ember); color: var(--ember2); font-weight: 600; }
.review-tab.inactive { background: transparent; border: 1px solid transparent; color: var(--text3); }
.review-tab.inactive:hover { color: var(--text2); }

.menu-btn { width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; border-radius: 4px; color: var(--text3); cursor: default; font-size: 13px; }
.menu-btn:hover { background: var(--glass2); color: var(--text); }

.modal-backdrop { position: absolute; inset: 0; background: rgba(5,3,2,0.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 50; }
.modal { background: linear-gradient(180deg, rgba(20,14,10,0.96), rgba(12,8,6,0.96)); border: 1px solid var(--border2); border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05); backdrop-filter: blur(16px); }

.collapsed-handle { width: 44px; background: var(--glass-dark); border-left: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding: 10px 0; gap: 12px; cursor: default; position: relative; }
.collapsed-handle:hover { background: rgba(20,14,10,0.85); }
.vertical-text { writing-mode: vertical-rl; transform: rotate(180deg); letter-spacing: 0.08em; }
</style>
</head>
<body>
<script type="text/babel">
const { useState } = React;

const R = ({ children, gap = 6, align = 'center', wrap = false, style = {} }) => (<div style={{ display:'flex', alignItems:align, gap, flexWrap: wrap?'wrap':'nowrap', ...style }}>{children}</div>);
const C = ({ children, gap = 6, style = {} }) => (<div style={{ display:'flex', flexDirection:'column', gap, ...style }}>{children}</div>);
const Sp = ({ f, w, h }) => <div style={{ flex: f, width: w, height: h, flexShrink: 0 }} />;
const Txt = ({ c='var(--text)', s=11, w=400, style={}, children }) => (<span style={{ color:c, fontSize:s, fontWeight:w, lineHeight:1.45, fontFamily:'Chakra Petch,sans-serif', ...style }}>{children}</span>);
const Tag = ({ type, children }) => <span className={`tag tag-${type}`}>{children}</span>;
const Btn = ({ v='ghost', style={}, children }) => (<div className={`btn btn-${v}`} style={style}>{children}</div>);
const SLabel = ({ children, style={} }) => <div className="section-label" style={style}>{children}</div>;
const Divider = ({ style={} }) => (<div style={{ height:1, background:'rgba(220,100,30,0.12)', ...style }} />);
const Input = ({ value, placeholder, multiline=false, focused=false, error=false, style={} }) => {
  const cls = `input-field ${value?'':'empty'} ${focused?'focused':''} ${error?'error':''}`;
  if (multiline) return <div className={cls} style={{ minHeight:64, ...style }}>{value || placeholder}</div>;
  return <div className={cls} style={style}>{value || placeholder}</div>;
};
const CamPill = ({ label, active }) => (<div className={active?'btn btn-cam':'btn btn-cam-inactive'}>{label}</div>);
const Avatar = ({ initials, size=22 }) => (<div className="avatar" style={{ width:size, height:size, fontSize:Math.max(8,size*0.4) }}>{initials}</div>);

const I = {
  play: <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><polygon points="3,2 10,6 3,10" fill="currentColor"/></svg>,
  prev: <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><polygon points="3,2 3,10 0,10 0,2" fill="currentColor"/><polygon points="3,6 10,2 10,10" fill="currentColor"/></svg>,
  next: <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><polygon points="0,2 6,6 0,10" fill="currentColor"/><polygon points="7,2 9,2 9,10 7,10" fill="currentColor"/></svg>,
  lock: <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><rect x="2" y="4.5" width="7" height="5.5" rx="1.2" stroke="currentColor" strokeWidth="1.2"/><path d="M3.5 4.5V3a2 2 0 014 0v1.5" stroke="currentColor" strokeWidth="1.2"/></svg>,
  plus: <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M5 1.5v7M1.5 5h7" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/></svg>,
  check: <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 5l2 2 4-4" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  arrow: <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 5h6M5.5 2l3 3-3 3" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  eye: <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M1 5.5s1.6-3 4.5-3 4.5 3 4.5 3-1.6 3-4.5 3-4.5-3-4.5-3z" stroke="currentColor" strokeWidth="1.1" fill="none"/><circle cx="5.5" cy="5.5" r="1.3" fill="currentColor"/></svg>,
  eyeOff: <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M1 5.5s1.6-3 4.5-3 4.5 3 4.5 3-1.6 3-4.5 3-4.5-3-4.5-3z" stroke="currentColor" strokeWidth="1.1" fill="none"/><line x1="1" y1="10" x2="10" y2="1" stroke="currentColor" strokeWidth="1.2"/></svg>,
  comment: <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M1.5 2.5h8v5h-3l-2 2v-2h-3z" stroke="currentColor" strokeWidth="1.2" fill="none"/></svg>,
  more: <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><circle cx="2.5" cy="6" r="1" fill="currentColor"/><circle cx="6" cy="6" r="1" fill="currentColor"/><circle cx="9.5" cy="6" r="1" fill="currentColor"/></svg>,
  drag: <svg width="10" height="12" viewBox="0 0 10 12" fill="none"><circle cx="3" cy="2.5" r="1" fill="currentColor"/><circle cx="7" cy="2.5" r="1" fill="currentColor"/><circle cx="3" cy="6" r="1" fill="currentColor"/><circle cx="7" cy="6" r="1" fill="currentColor"/><circle cx="3" cy="9.5" r="1" fill="currentColor"/><circle cx="7" cy="9.5" r="1" fill="currentColor"/></svg>,
  collapse: <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M6.5 2l-3 3 3 3" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  expand: <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M3.5 2l3 3-3 3" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  close: <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 2l6 6M8 2l-6 6" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/></svg>,
};

const Transport = ({ time='00:17', total='01:15', locked=false }) => (
  <div className="transport" style={ locked ? {opacity:0.4, pointerEvents:'none', background:'rgba(8,4,2,0.98)'} : {}}>
    <span style={{color:'var(--text2)'}}>{I.prev}</span>
    <span style={{color:'var(--text)'}}>{I.play}</span>
    <span style={{color:'var(--text2)'}}>{I.next}</span>
    <div className="transport-track">
      <div className="transport-fill" style={{ width:'28%', background: locked ? 'rgba(232,83,26,0.3)' : 'var(--ember)' }} />
      {!locked && <div className="transport-head" style={{ left:'28%' }} />}
    </div>
    <Txt c="var(--text2)" s={10}>{time} / {total}{locked ? ' — locked' : ''}</Txt>
  </div>
);

const StageBase = ({ children, cam='FOH' }) => (
  <div className="stage-viewer">
    <div className="stage-grid" />
    <svg style={{ position:'absolute', inset:0, width:'100%', height:'100%', opacity:0.22 }} viewBox="0 0 700 420" preserveAspectRatio="xMidYMid slice">
      {[0,1,2,3,4,5,6,7].map(i => (<line key={i} x1={350} y1={200} x2={i*100} y2={420} stroke="#E8531A" strokeWidth="0.6" />))}
      {[0,1,2,3,4].map(i => (<line key={i} x1={0} y1={420-i*60} x2={700} y2={420-i*60} stroke="#E8531A" strokeWidth="0.4" />))}
      <ellipse cx="350" cy="300" rx="200" ry="75" stroke="#E8531A" strokeWidth="0.8" fill="none" strokeDasharray="5 4" opacity="0.6"/>
      <rect x="150" y="160" width="400" height="180" stroke="#E8531A" strokeWidth="0.8" fill="none" strokeDasharray="4 3" opacity="0.5"/>
      <rect x="240" y="185" width="90" height="130" stroke="#E8531A" strokeWidth="0.7" fill="rgba(232,83,26,0.04)" opacity="0.7"/>
      <rect x="370" y="185" width="90" height="130" stroke="#E8531A" strokeWidth="0.7" fill="rgba(232,83,26,0.04)" opacity="0.7"/>
    </svg>
    <div style={{ position:'absolute', inset:0, background:'radial-gradient(ellipse 80% 80% at 50% 50%, transparent 40%, rgba(5,3,2,0.65) 100%)', pointerEvents:'none' }} />
    <div style={{ position:'absolute', top:10, left:12 }}>
      <span style={{ color:'var(--cam)', background:'rgba(31,160,238,0.12)', border:'1px solid rgba(31,160,238,0.35)', borderRadius:4, padding:'2px 7px', fontSize:9, letterSpacing:'0.08em', fontWeight:600, boxShadow:'var(--cam-glow)' }}>● CAM: {cam}</span>
    </div>
    <div style={{ position:'absolute', bottom:12, left:14, color:'rgba(244,236,226,0.18)', fontSize:8, letterSpacing:'0.1em', textTransform:'uppercase' }}>3D Stage Viewer · Previz Engine</div>
    {children}
  </div>
);

const ClipItem = ({ index, label, time, active, feedbacks, hidden }) => (
  <div style={{ display:'flex', gap:8, alignItems:'center', padding:'6px 8px', borderRadius:8, cursor:'default', background: active ? 'rgba(232,83,26,0.08)' : 'transparent', borderLeft: `2px solid ${active ? 'var(--ember)' : 'transparent'}`, opacity: hidden ? 0.5 : 1 }}>
    <span style={{color:'var(--text4)'}}>{I.drag}</span>
    <div className={`clip-thumb ${active?'active':''}`} style={{ width:46, height:30 }}><div className="clip-thumb-bg" /></div>
    <C gap={1} style={{ flex:1, minWidth:0 }}>
      <R gap={4}>
        <Txt s={11} w={active?600:500} c={active?'var(--text)':'var(--text2)'} style={{ overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', flex:1 }}>{label}</Txt>
        {hidden && <span style={{color:'var(--text3)'}}>{I.eyeOff}</span>}
      </R>
      <Txt s={9} c="var(--text3)">{time} · #{index}</Txt>
    </C>
    {feedbacks > 0 && (<div style={{ background:'var(--amber)', borderRadius:9, padding:'1px 6px', fontSize:9, color:'#1a0a00', fontWeight:700 }}>{feedbacks}</div>)}
  </div>
);

const RefImg = ({ label, w=68, h=46, hiddenFromClient=false, onReorder=false }) => (
  <C gap={3} style={{ flexShrink:0, position:'relative' }}>
    <div className="ref-img-block" style={{ width:w, height:h, opacity: hiddenFromClient ? 0.5 : 1 }}>
      <div className="hatch" />
      <Txt s={8} c="var(--text3)" style={{ position:'relative', zIndex:1 }}>ref img</Txt>
      {onReorder && (<div style={{ position:'absolute', top:2, right:2, background:'rgba(0,0,0,0.6)', borderRadius:3, padding:'1px 3px', color:'var(--text2)', zIndex:2 }}>{I.drag}</div>)}
    </div>
    <R gap={3} style={{ alignSelf:'center' }}>
      <Txt s={9} c="var(--text2)">{label}</Txt>
      {hiddenFromClient && <span style={{color:'var(--text3)'}}>{I.eyeOff}</span>}
    </R>
  </C>
);

const FeedbackItem = ({ author, text, status, time, cam, ts, active=false, withActions=false }) => (
  <div className={`feedback-item ${active?'active':''}`}>
    <R gap={7} style={{ marginBottom:5 }}>
      <Avatar initials={author[0]} size={20} />
      <Txt s={11} w={600}>{author}</Txt>
      <Tag type={status}>{status}</Tag>
      <Sp f={1} />
      <Txt s={9} c="var(--text3)">{time}</Txt>
    </R>
    <Txt s={11} c="var(--text2)" style={{ display:'block', paddingLeft:27, lineHeight:1.5 }}>{text}</Txt>
    <R gap={5} style={{ marginTop:5, paddingLeft:27 }}>
      {(cam || ts) && (<div style={{ background:'var(--cam-dim)', border:'1px solid rgba(31,160,238,0.3)', borderRadius:4, padding:'1px 6px', fontSize:9, color:'var(--cam)', fontWeight:500 }}>{cam}{ts ? ` · ${ts}` : ''}</div>)}
    </R>
    {withActions && (
