<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stage Visualizer — Wireframes</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f5f0e8; font-family: 'Caveat', cursive; }

  /* Wireframe palette */
  :root {
    --ink: #1a1a1a;
    --ink2: #3a3632;
    --ink3: #6b6560;
    --paper: #faf7f2;
    --paper2: #ede9e0;
    --paper3: #ddd8cc;
    --accent: #FF5F1F;
    --blue: #2b7fff;
    --green: #2d8a4e;
    --amber: #c47a1a;
    --border: #b5afa3;
    --hatch: #ccc5b8;
  }

  /* Wireframe component primitives */
  .wf-screen {
    background: var(--paper);
    border: 2px solid var(--ink2);
    border-radius: 4px;
    overflow: hidden;
    font-family: 'Caveat', cursive;
    position: relative;
  }

  .wf-topbar {
    height: 34px;
    background: var(--paper2);
    border-bottom: 1.5px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 10px;
    flex-shrink: 0;
  }

  .wf-label {
    font-family: 'Caveat', cursive;
    font-size: 13px;
    color: var(--ink2);
    line-height: 1.2;
  }
  .wf-label.sm { font-size: 11px; color: var(--ink3); }
  .wf-label.lg { font-size: 16px; font-weight: 700; color: var(--ink); }
  .wf-label.xl { font-size: 20px; font-weight: 700; color: var(--ink); }
  .wf-label.accent { color: var(--accent); }
  .wf-label.blue { color: var(--blue); }
  .wf-label.green { color: var(--green); }
  .wf-label.amber { color: var(--amber); }

  .wf-btn {
    border: 1.5px solid var(--ink2);
    border-radius: 3px;
    padding: 2px 8px;
    font-family: 'Caveat', cursive;
    font-size: 12px;
    background: var(--paper);
    color: var(--ink);
    display: inline-flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
    cursor: default;
  }
  .wf-btn.filled {
    background: var(--ink2);
    color: var(--paper);
  }
  .wf-btn.accent {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }
  .wf-btn.blue {
    background: var(--blue);
    border-color: var(--blue);
    color: white;
  }
  .wf-btn.sm { font-size: 11px; padding: 1px 6px; }

  .wf-panel {
    background: var(--paper2);
    border: 1.5px solid var(--border);
    border-radius: 3px;
  }

  .wf-section-title {
    font-size: 10px;
    font-family: 'IBM Plex Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink3);
    padding: 4px 6px 3px;
    border-bottom: 1px solid var(--hatch);
  }

  .wf-input {
    background: var(--paper);
    border: 1.5px solid var(--border);
    border-radius: 3px;
    padding: 3px 6px;
    font-family: 'Caveat', cursive;
    font-size: 12px;
    color: var(--ink2);
    width: 100%;
  }

  .wf-hatch {
    background: repeating-linear-gradient(
      45deg,
      var(--hatch) 0px,
      var(--hatch) 1px,
      transparent 1px,
      transparent 6px
    );
  }

  .wf-stage-placeholder {
    background: #1a1c1f;
    border: 1.5px dashed #444;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    position: relative;
    overflow: hidden;
  }
  .wf-stage-placeholder::after {
    content: '';
    position: absolute;
    inset: 0;
    background: 
      repeating-linear-gradient(0deg, transparent 0, transparent 28px, rgba(255,255,255,0.03) 28px, rgba(255,255,255,0.03) 29px),
      repeating-linear-gradient(90deg, transparent 0, transparent 28px, rgba(255,255,255,0.03) 28px, rgba(255,255,255,0.03) 29px);
  }

  .wf-stage-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: rgba(255,255,255,0.25);
    z-index: 1;
    text-align: center;
    line-height: 1.6;
  }

  .wf-clip-thumb {
    background: #2a2c2f;
    border: 1.5px solid #444;
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    flex-shrink: 0;
  }
  .wf-clip-thumb.active {
    border-color: var(--blue);
    box-shadow: 0 0 0 1.5px var(--blue);
  }
  .wf-clip-thumb-inner {
    width: 100%;
    height: 100%;
    background: repeating-linear-gradient(
      45deg,
      #222 0px, #222 2px,
      #2a2c2f 2px, #2a2c2f 8px
    );
  }

  .wf-tag {
    font-size: 10px;
    font-family: 'IBM Plex Mono', monospace;
    padding: 1px 5px;
    border-radius: 2px;
    display: inline-block;
  }
  .wf-tag.draft { background: #e8e4da; color: #6b6560; border: 1px solid #b5afa3; }
  .wf-tag.unsaved { background: #fef3e2; color: #c47a1a; border: 1px solid #c47a1a; }
  .wf-tag.published { background: #e6f4ec; color: #2d8a4e; border: 1px solid #2d8a4e; }
  .wf-tag.pending { background: #fef3e2; color: #c47a1a; border: 1px solid #c47a1a; }
  .wf-tag.resolved { background: #e6f4ec; color: #2d8a4e; border: 1px solid #2d8a4e; }
  .wf-tag.active-cam { background: #e8f0ff; color: #2b7fff; border: 1px solid #2b7fff; }

  .wf-divider {
    height: 1px;
    background: var(--hatch);
    margin: 4px 0;
  }

  .wf-icon {
    width: 14px;
    height: 14px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    opacity: 0.7;
    flex-shrink: 0;
  }

  .wf-ref-img {
    border: 1.5px dashed var(--border);
    border-radius: 3px;
    background: var(--hatch);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    color: var(--ink3);
    flex-shrink: 0;
  }

  .wf-transport {
    background: rgba(15,15,18,0.95);
    border-top: 1px solid #333;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 12px;
    flex-shrink: 0;
  }

  .wf-annotation-circle {
    position: absolute;
    border: 2px dashed var(--accent);
    border-radius: 50%;
    pointer-events: none;
  }

  .wf-feedback-pin {
    position: absolute;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent);
    border: 1.5px solid white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    color: white;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 700;
    z-index: 10;
  }

  .wf-callout {
    background: #fffbf5;
    border: 1.5px solid var(--accent);
    border-radius: 4px;
    border-left: 3px solid var(--accent);
    padding: 5px 8px;
    font-size: 12px;
    color: var(--ink2);
    line-height: 1.4;
  }

  .wf-callout.blue {
    border-color: var(--blue);
    border-left-color: var(--blue);
  }
  .wf-callout.green {
    border-color: var(--green);
    border-left-color: var(--green);
  }

  .annotation-label {
    position: absolute;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    color: var(--accent);
    background: rgba(255,95,31,0.12);
    padding: 1px 4px;
    border-radius: 2px;
    white-space: nowrap;
  }

  /* mobile notch simulation */
  .wf-mobile-status {
    height: 22px;
    background: #0d0d0f;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    flex-shrink: 0;
  }
</style>
</head>
<body>
<script type="text/babel">

/* ─── SHARED PRIMITIVES ─── */

const Icon = ({ ch, size = 14 }) => (
  <span style={{ fontSize: size, lineHeight: 1, display: 'inline-block', opacity: 0.75 }}>{ch}</span>
);

const Spacer = ({ w, h }) => <div style={{ width: w, height: h, flexShrink: 0 }} />;

const Row = ({ children, gap = 6, align = 'center', style = {} }) => (
  <div style={{ display: 'flex', alignItems: align, gap, ...style }}>{children}</div>
);

const Col = ({ children, gap = 6, style = {} }) => (
  <div style={{ display: 'flex', flexDirection: 'column', gap, ...style }}>{children}</div>
);

const Tag = ({ type, children }) => <span className={`wf-tag ${type}`}>{children}</span>;
const Btn = ({ variant = '', children, style = {} }) => <div className={`wf-btn ${variant}`} style={style}>{children}</div>;
const Label = ({ size = '', color = '', children, style = {} }) => <span className={`wf-label ${size} ${color}`} style={style}>{children}</span>;
const SectionTitle = ({ children }) => <div className="wf-section-title">{children}</div>;
const Divider = () => <div className="wf-divider" />;
const Input = ({ placeholder }) => <div className="wf-input" style={{ color: '#9a9490' }}>{placeholder}</div>;

const ClipThumb = ({ label, active, index, time }) => (
  <div style={{ display: 'flex', gap: 6, alignItems: 'center', padding: '4px 6px', background: active ? 'rgba(43,127,255,0.08)' : 'transparent', borderRadius: 3, cursor: 'default', borderLeft: active ? '2px solid #2b7fff' : '2px solid transparent' }}>
    <div className={`wf-clip-thumb ${active ? 'active' : ''}`} style={{ width: 44, height: 28 }}>
      <div className="wf-clip-thumb-inner" />
      {active && <div style={{ position: 'absolute', bottom: 1, right: 2, fontSize: 8, color: '#2b7fff', fontFamily: 'IBM Plex Mono', fontWeight: 700 }}>▶</div>}
    </div>
    <Col gap={1} style={{ flex: 1, minWidth: 0 }}>
      <Label style={{ fontSize: 12, fontWeight: active ? 700 : 400, color: active ? '#1a1a1a' : '#4a4640' }}>{label}</Label>
      <Label size="sm" style={{ fontSize: 10, fontFamily: 'IBM Plex Mono', color: '#9a9490' }}>{time}</Label>
    </Col>
    <Label style={{ fontSize: 11, color: '#9a9490', fontFamily: 'IBM Plex Mono' }}>#{index}</Label>
  </div>
);

const RefImage = ({ label, w = 56, h = 40 }) => (
  <Col gap={3} style={{ flexShrink: 0 }}>
    <div className="wf-ref-img" style={{ width: w, height: h }}>ref img</div>
    <Label size="sm" style={{ fontSize: 10, maxWidth: w, textAlign: 'center' }}>{label}</Label>
  </Col>
);

const FeedbackItem = ({ author, text, status, time }) => (
  <div style={{ padding: '5px 6px', borderRadius: 3, background: '#f5f2ec', border: '1px solid #ddd8cc' }}>
    <Row gap={6} style={{ marginBottom: 2 }}>
      <div style={{ width: 16, height: 16, borderRadius: '50%', background: '#c8c2b8', flexShrink: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 9, color: '#5a5650' }}>{author[0]}</div>
      <Label style={{ fontSize: 12, fontWeight: 700 }}>{author}</Label>
      <Tag type={status === 'resolved' ? 'resolved' : 'pending'}>{status}</Tag>
      <Label size="sm" style={{ marginLeft: 'auto', fontSize: 10 }}>{time}</Label>
    </Row>
    <Label style={{ fontSize: 12, color: '#3a3632', paddingLeft: 22, lineHeight: 1.4, display: 'block' }}>{text}</Label>
  </div>
);

const CamBtn = ({ label, active }) => (
  <div style={{ padding: '2px 7px', borderRadius: 3, background: active ? 'rgba(43,127,255,0.15)' : 'transparent', border: `1px solid ${active ? '#2b7fff' : '#555'}`, fontSize: 11, color: active ? '#2b7fff' : '#888', fontFamily: 'IBM Plex Mono', cursor: 'default', whiteSpace: 'nowrap' }}>{label}</div>
);

const Transport = ({ h = 32 }) => (
  <div className="wf-transport" style={{ height: h }}>
    <Icon ch="⏮" size={13} />
    <Icon ch="▶" size={13} />
    <Icon ch="⏭" size={13} />
    <div style={{ flex: 1, height: 3, background: '#333', borderRadius: 2, position: 'relative', margin: '0 4px' }}>
      <div style={{ position: 'absolute', left: 0, top: 0, height: '100%', width: '30%', background: '#FF5F1F', borderRadius: 2 }} />
      <div style={{ position: 'absolute', left: '30%', top: '50%', transform: 'translate(-50%, -50%)', width: 8, height: 8, borderRadius: '50%', background: 'white', border: '1.5px solid #FF5F1F' }} />
    </div>
    <span style={{ fontFamily: 'IBM Plex Mono', fontSize: 10, color: '#888' }}>00:14 / 01:02</span>
    <Spacer w={6} />
    <Icon ch="🔊" size={12} />
    <Icon ch="⛶" size={13} />
  </div>
);

/* ─── SCREEN 1: ADMIN EDITOR ─── */
const AdminScreen = () => (
  <div className="wf-screen" style={{ width: 960, height: 620, display: 'flex', flexDirection: 'column' }}>
    {/* Top bar */}
    <div className="wf-topbar" style={{ gap: 8, height: 38 }}>
      <div style={{ width: 20, height: 20, borderRadius: 3, background: '#1a1a1a', flexShrink: 0 }} />
      <Label style={{ fontWeight: 700, fontSize: 14 }}>StageViz</Label>
      <div style={{ width: 1, height: 20, background: '#c8c2b8' }} />
      <Label style={{ fontSize: 13 }}>Coachella 2026 — Main Stage</Label>
      <Tag type="unsaved">● unsaved changes</Tag>
      <Spacer w={0} style={{ flex: 1 }} />
      <Btn><Icon ch="👁" size={11} /> Preview client</Btn>
      <Btn><Icon ch="⏱" size={11} /> v3 · 2h ago</Btn>
      <Btn variant="accent"><Icon ch="🚀" size={11} /> Publish</Btn>
    </div>

    {/* Three-column body */}
    <div style={{ flex: 1, display: 'flex', overflow: 'hidden' }}>

      {/* LEFT — Clip sequence */}
      <div className="wf-panel" style={{ width: 160, borderRadius: 0, borderTop: 'none', borderLeft: 'none', borderBottom: 'none', display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
        <div style={{ padding: '5px 8px', borderBottom: '1px solid #ddd8cc' }}>
          <Row gap={4}>
            <SectionTitle>Clips / Slides</SectionTitle>
            <div style={{ marginLeft: 'auto', display: 'flex', gap: 3 }}>
              <Btn variant="sm"><Icon ch="+" size={11} /></Btn>
            </div>
          </Row>
        </div>
        <div style={{ flex: 1, overflowY: 'auto', padding: 4 }}>
          <ClipThumb index={1} label="Intro Logo Reveal" active time="0:42" />
          <ClipThumb index={2} label="Act 1 — Main Stage" active={false} time="1:15" />
          <ClipThumb index={3} label="LED Wall Test A" active={false} time="0:28" />
          <ClipThumb index={4} label="Confetti Burst" active={false} time="0:20" />
          <ClipThumb index={5} label="Outro Flythrough" active={false} time="1:03" />
        </div>
        <div style={{ padding: 6, borderTop: '1px solid #ddd8cc' }}>
          <Label size="sm" style={{ fontSize: 10 }}>Drag to reorder</Label>
        </div>
      </div>

      {/* CENTER — Stage + transport */}
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', position: 'relative' }}>
        {/* Clip title bar */}
        <div style={{ padding: '5px 10px', borderBottom: '1px solid #ddd8cc', background: '#f0ece4' }}>
          <Row gap={8}>
            <Label style={{ fontWeight: 700, fontSize: 13 }}>Intro Logo Reveal</Label>
            <Label style={{ fontSize: 12, color: '#6b6560' }}>Clip 1 of 5</Label>
            <div style={{ marginLeft: 'auto', display: 'flex', gap: 5 }}>
              <CamBtn label="FOH" active />
              <CamBtn label="Stage-L" active={false} />
              <CamBtn label="Overhead" active={false} />
              <CamBtn label="Aerial" active={false} />
            </div>
          </Row>
        </div>

        {/* 3D Stage area */}
        <div className="wf-stage-placeholder" style={{ flex: 1 }}>
          {/* Grid perspective lines */}
          <svg style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', opacity: 0.15 }} viewBox="0 0 600 360" preserveAspectRatio="xMidYMid slice">
            {[0,1,2,3,4,5,6].map(i => (
              <line key={i} x1={300} y1={180} x2={i * 100} y2={360} stroke="white" strokeWidth="0.8" />
            ))}
            {[1,2,3,4,5,6,7].map(i => (
              <line key={i} x1={0} y1={360 - i*40} x2={600} y2={360 - i*40} stroke="white" strokeWidth="0.5" />
            ))}
            <ellipse cx="300" cy="240" rx="160" ry="60" stroke="white" strokeWidth="1" fill="none" strokeDasharray="4 3" />
            <rect x="140" y="150" width="320" height="130" stroke="white" strokeWidth="1" fill="none" strokeDasharray="3 3" />
            <rect x="200" y="170" width="80" height="100" stroke="white" strokeWidth="0.8" fill="none" />
            <rect x="320" y="170" width="80" height="100" stroke="white" strokeWidth="0.8" fill="none" />
          </svg>
          <div className="wf-stage-label">3D STAGE VIEWER<br />(Previz engine renders here)<br />No overlays — clean view</div>
          {/* Camera label */}
          <div style={{ position: 'absolute', top: 8, left: 8, fontFamily: 'IBM Plex Mono', fontSize: 10, color: '#2b7fff', background: 'rgba(43,127,255,0.15)', padding: '2px 6px', borderRadius: 2 }}>● CAM: FOH</div>
        </div>

        <Transport h={32} />
      </div>

      {/* RIGHT — Context Editor */}
      <div className="wf-panel" style={{ width: 224, borderRadius: 0, borderTop: 'none', borderRight: 'none', borderBottom: 'none', display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
        <div style={{ padding: '5px 8px', borderBottom: '1px solid #ddd8cc', background: '#f0ece4' }}>
          <Row gap={4}>
            <SectionTitle>Context Editor</SectionTitle>
            <Tag type="draft" style={{ marginLeft: 'auto' }}>draft</Tag>
          </Row>
        </div>
        <div style={{ flex: 1, overflowY: 'auto', padding: 8 }}>
          <Col gap={8}>
            <Col gap={3}>
              <Label size="sm">Clip Title</Label>
              <Input placeholder="Intro Logo Reveal" />
            </Col>
            <Col gap={3}>
              <Label size="sm">Subtitle</Label>
              <Input placeholder="Opening sequence · FOH camera" />
            </Col>
            <Col gap={3}>
              <Label size="sm">Client Note / Body</Label>
              <div className="wf-input" style={{ height: 64, color: '#9a9490', alignItems: 'flex-start', paddingTop: 4 }}>
                This intro uses a timed LED reveal synced to the kick drum...
              </div>
            </Col>

            <Col gap={3}>
              <Row gap={4}>
                <Label size="sm">Default Camera</Label>
              </Row>
              <Row gap={4} style={{ flexWrap: 'wrap' }}>
                <CamBtn label="FOH" active />
                <CamBtn label="Stage-L" active={false} />
                <CamBtn label="Overhead" active={false} />
              </Row>
            </Col>

            <Divider />

            <Col gap={4}>
              <Row gap={4}>
                <Label size="sm">Reference Images / GIFs</Label>
                <Btn variant="sm" style={{ marginLeft: 'auto' }}><Icon ch="+" size={10} /> Add</Btn>
              </Row>
              <Row gap={6} style={{ flexWrap: 'wrap' }}>
                <RefImage label="Mood ref" w={60} h={42} />
                <RefImage label="LED map" w={60} h={42} />
                <div className="wf-ref-img" style={{ width: 60, height: 42, borderStyle: 'dashed', borderColor: '#b5afa3', cursor: 'default', flexDirection: 'column', gap: 2, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                  <span style={{ fontSize: 18, opacity: 0.4 }}>+</span>
                </div>
              </Row>
            </Col>

            <Divider />

            <div className="wf-callout">
              <b>Admin note:</b> References + notes stay in this panel. Nothing should be placed directly over the 3D viewer.
            </div>
          </Col>
        </div>

        <div style={{ padding: 8, borderTop: '1px solid #ddd8cc', display: 'flex', gap: 6 }}>
          <Btn style={{ flex: 1, justifyContent: 'center' }}>Save draft</Btn>
          <Btn variant="accent" style={{ flex: 1, justifyContent: 'center' }}>Publish</Btn>
        </div>
      </div>
    </div>

    {/* Callout annotations */}
    <div style={{ position: 'absolute', left: 10, bottom: 50, pointerEvents: 'none' }}>
      <div className="annotation-label">← clip reorder via drag</div>
    </div>
  </div>
);

/* ─── SCREEN 2: CLIENT REVIEW (normal) ─── */
const ClientScreen = () => (
  <div className="wf-screen" style={{ width: 960, height: 620, display: 'flex', flexDirection: 'column' }}>
    {/* Top bar */}
    <div className="wf-topbar" style={{ height: 36 }}>
      <div style={{ width: 18, height: 18, borderRadius: 3, background: '#1a1a1a', flexShrink: 0 }} />
      <Label style={{ fontWeight: 700, fontSize: 13 }}>StageViz</Label>
      <div style={{ width: 1, height: 18, background: '#c8c2b8' }} />
      <Label style={{ fontSize: 12 }}>Coachella 2026 — Main Stage</Label>
      <Tag type="published">published v4</Tag>
      <Spacer style={{ flex: 1 }} />
      <Btn variant="accent"><Icon ch="💬" size={11} /> Leave Feedback</Btn>
      <div style={{ width: 24, height: 24, borderRadius: '50%', background: '#c8c2b8', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 11 }}>JR</div>
    </div>

    <div style={{ flex: 1, display: 'flex', overflow: 'hidden' }}>
      {/* CENTER — Stage */}
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column' }}>
        {/* Clip strip */}
