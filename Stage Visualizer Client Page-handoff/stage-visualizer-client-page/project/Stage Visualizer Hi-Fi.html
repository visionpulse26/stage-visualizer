<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stage Visualizer — Hi-Fi Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #111; font-family: 'Chakra Petch', sans-serif; }

:root {
  --bg:        #080604;
  --bg1:       #0f0c09;
  --bg2:       #161210;
  --glass:     rgba(255,255,255,0.035);
  --glass2:    rgba(255,255,255,0.055);
  --glass3:    rgba(255,255,255,0.08);
  --border:    rgba(220,100,30,0.18);
  --border2:   rgba(220,100,30,0.28);
  --ember:     #E8531A;
  --ember2:    #FF6B2B;
  --ember-dim: rgba(232,83,26,0.15);
  --ember-glow: 0 0 14px rgba(232,83,26,0.45), 0 0 2px rgba(232,83,26,0.8);
  --cam:       #1A8FE3;
  --cam-dim:   rgba(26,143,227,0.15);
  --cam-glow:  0 0 10px rgba(26,143,227,0.35);
  --green:     #1DB974;
  --amber:     #D4820A;
  --text:      #F0E8E0;
  --text2:     #A09080;
  --text3:     #604840;
  --panel-r:   10px;
  --ctrl-r:    6px;
}

.screen {
  font-family: 'Chakra Petch', sans-serif;
  background: var(--bg);
  overflow: hidden;
  position: relative;
}

/* Ambient bg glow */
.screen::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 60% 40% at 15% 100%, rgba(180,50,10,0.12) 0%, transparent 60%),
    radial-gradient(ellipse 40% 30% at 85% 0%, rgba(26,143,227,0.06) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}

.screen > * { position: relative; z-index: 1; }

/* Glass panel */
.glass-panel {
  background: var(--glass);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  border-radius: var(--panel-r);
}
.glass-panel.active {
  border-color: var(--border2);
  box-shadow: inset 0 0 20px rgba(232,83,26,0.06);
}

/* Top bar */
.topbar {
  height: 40px;
  background: rgba(10,8,6,0.92);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 14px;
  flex-shrink: 0;
  backdrop-filter: blur(20px);
  position: relative;
  z-index: 10;
}

/* Logo mark */
.logo-mark {
  width: 22px; height: 22px;
  background: var(--ember);
  border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: white;
  flex-shrink: 0;
  box-shadow: var(--ember-glow);
}

.topbar-divider {
  width: 1px; height: 20px;
  background: rgba(220,100,30,0.2);
  flex-shrink: 0;
}

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 10px;
  border-radius: var(--ctrl-r);
  font-family: 'Chakra Petch', sans-serif;
  font-size: 11px; font-weight: 500;
  cursor: default;
  white-space: nowrap;
  letter-spacing: 0.02em;
  transition: all 0.15s;
}
.btn-ghost {
  background: var(--glass2);
  border: 1px solid rgba(220,100,30,0.2);
  color: var(--text2);
}
.btn-ghost:hover { border-color: var(--border2); color: var(--text); }
.btn-ember {
  background: var(--ember);
  border: 1px solid var(--ember2);
  color: white;
  box-shadow: var(--ember-glow);
}
.btn-ember-outline {
  background: var(--ember-dim);
  border: 1px solid var(--ember);
  color: var(--ember2);
}
.btn-cam {
  background: var(--cam-dim);
  border: 1px solid var(--cam);
  color: var(--cam);
  font-size: 10px; padding: 3px 8px;
  box-shadow: var(--cam-glow);
}
.btn-cam-inactive {
  background: var(--glass);
  border: 1px solid rgba(255,255,255,0.1);
  color: var(--text3);
  font-size: 10px; padding: 3px 8px;
}

/* Status tags */
.tag {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 7px;
  border-radius: 4px;
  font-size: 9px; font-weight: 600;
  letter-spacing: 0.06em; text-transform: uppercase;
  font-family: 'Chakra Petch', sans-serif;
}
.tag-draft     { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); color: #888; }
.tag-unsaved   { background: rgba(212,130,10,0.15); border: 1px solid var(--amber); color: var(--amber); }
.tag-published { background: rgba(29,185,116,0.12); border: 1px solid var(--green); color: var(--green); }
.tag-pending   { background: rgba(212,130,10,0.12); border: 1px solid rgba(212,130,10,0.5); color: var(--amber); }
.tag-resolved  { background: rgba(29,185,116,0.1); border: 1px solid rgba(29,185,116,0.4); color: var(--green); }
.tag-locked    { background: rgba(232,83,26,0.15); border: 1px solid var(--ember); color: var(--ember); }

/* Section label */
.section-label {
  font-size: 9px; font-weight: 600;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--text3);
  padding: 0 0 4px 0;
}

/* Input */
.input-field {
  width: 100%;
  background: rgba(0,0,0,0.3);
  border: 1px solid rgba(220,100,30,0.18);
  border-radius: 6px;
  padding: 5px 8px;
  font-family: 'Chakra Petch', sans-serif;
  font-size: 11px;
  color: var(--text);
  outline: none;
}
.input-field::placeholder { color: var(--text3); }

/* Stage viewer */
.stage-viewer {
  background: #050404;
  position: relative;
  overflow: hidden;
  flex: 1;
}
.stage-grid {
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(232,83,26,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(232,83,26,0.04) 1px, transparent 1px);
  background-size: 40px 40px;
}
.stage-label-overlay {
  position: absolute;
  font-family: 'Chakra Petch', sans-serif;
  font-size: 9px;
  letter-spacing: 0.08em;
  color: rgba(240,232,224,0.2);
  text-transform: uppercase;
}

/* Clip thumbnail */
.clip-thumb {
  background: #1a1410;
  border: 1px solid rgba(220,100,30,0.15);
  border-radius: 6px;
  overflow: hidden;
  position: relative;
  flex-shrink: 0;
}
.clip-thumb.active {
  border-color: var(--ember);
  box-shadow: 0 0 10px rgba(232,83,26,0.3), inset 0 0 8px rgba(232,83,26,0.08);
}
.clip-thumb-bg {
  background: repeating-linear-gradient(
    135deg,
    #1a1410 0px, #1a1410 3px,
    #201810 3px, #201810 9px
  );
  width: 100%; height: 100%;
}

/* Scrollbar */
::-webkit-scrollbar { width: 3px; height: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(220,100,30,0.25); border-radius: 2px; }

/* Feedback item */
.feedback-item {
  background: rgba(0,0,0,0.2);
  border: 1px solid rgba(220,100,30,0.1);
  border-radius: 8px;
  padding: 7px 9px;
}
.feedback-item:hover { border-color: rgba(220,100,30,0.2); }

/* Transport */
.transport {
  height: 36px;
  background: rgba(5,4,3,0.95);
  border-top: 1px solid rgba(220,100,30,0.12);
  display: flex; align-items: center; gap: 10px;
  padding: 0 14px;
  flex-shrink: 0;
}
.transport-track {
  flex: 1; height: 3px;
  background: rgba(255,255,255,0.08);
  border-radius: 2px; position: relative;
  cursor: default;
}
.transport-fill {
  position: absolute; left: 0; top: 0; height: 100%;
  background: var(--ember); border-radius: 2px;
}
.transport-head {
  position: absolute; top: 50%;
  transform: translate(-50%, -50%);
  width: 9px; height: 9px; border-radius: 50%;
  background: white;
  box-shadow: 0 0 6px rgba(232,83,26,0.8);
}

/* Panel header */
.panel-header {
  padding: 8px 10px;
  border-bottom: 1px solid rgba(220,100,30,0.1);
  flex-shrink: 0;
}

/* Ref image */
.ref-img-block {
  background: rgba(0,0,0,0.3);
  border: 1px dashed rgba(220,100,30,0.2);
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; color: var(--text3);
  font-family: 'Chakra Petch', sans-serif;
  position: relative; overflow: hidden;
}
.ref-img-block .hatch {
  position: absolute; inset: 0;
  background: repeating-linear-gradient(
    45deg, transparent, transparent 4px,
    rgba(220,100,30,0.04) 4px, rgba(220,100,30,0.04) 5px
  );
}

/* Avatar */
.avatar {
  border-radius: 50%;
  background: linear-gradient(135deg, #8B3010, #3A2010);
  border: 1px solid rgba(232,83,26,0.4);
  display: flex; align-items: center; justify-content: center;
  color: var(--ember2); font-size: 9px; font-weight: 700;
  flex-shrink: 0;
}

/* Annotation circle */
.annot-circle {
  position: absolute;
  border: 2px dashed var(--ember);
  border-radius: 50%;
  box-shadow: 0 0 12px rgba(232,83,26,0.3), inset 0 0 8px rgba(232,83,26,0.08);
  pointer-events: none;
}
.annot-pin {
  position: absolute;
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--ember);
  border: 1.5px solid rgba(255,255,255,0.6);
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; color: white; font-weight: 700;
  box-shadow: var(--ember-glow);
  z-index: 10;
}

/* Mobile status bar */
.mobile-status {
  height: 24px;
  background: #030202;
  display: flex; align-items: center;
  justify-content: space-between;
  padding: 0 14px;
  flex-shrink: 0;
}

/* Admin feedback review — tab styles */
.review-tab {
  padding: 4px 10px;
  font-size: 10px; font-weight: 500;
  border-radius: 4px; cursor: default;
  letter-spacing: 0.04em;
}
.review-tab.active {
  background: var(--ember-dim);
  border: 1px solid var(--ember);
  color: var(--ember2);
}
.review-tab.inactive {
  background: transparent;
  border: 1px solid transparent;
  color: var(--text3);
}
</style>
</head>
<body>
<script type="text/babel">

const { useState } = React;

/* ─── SHARED PRIMITIVES ─── */
const R = ({ children, gap = 6, align = 'center', wrap = false, style = {} }) => (
  <div style={{ display:'flex', alignItems:align, gap, flexWrap: wrap?'wrap':'nowrap', ...style }}>{children}</div>
);
const C = ({ children, gap = 6, style = {} }) => (
  <div style={{ display:'flex', flexDirection:'column', gap, ...style }}>{children}</div>
);
const Sp = ({ f, w, h }) => <div style={{ flex: f, width: w, height: h, flexShrink: 0 }} />;

const Txt = ({ c = 'var(--text)', s = 11, w = 400, style = {}, children }) => (
  <span style={{ color: c, fontSize: s, fontWeight: w, lineHeight: 1.4, fontFamily:'Chakra Petch,sans-serif', ...style }}>{children}</span>
);

const Tag = ({ type, children }) => <span className={`tag tag-${type}`}>{children}</span>;

const Btn = ({ v = 'ghost', style = {}, children, onClick }) => (
  <div className={`btn btn-${v}`} style={style} onClick={onClick}>{children}</div>
);

const SLabel = ({ children }) => <div className="section-label">{children}</div>;

const Divider = ({ style = {} }) => (
  <div style={{ height: 1, background: 'rgba(220,100,30,0.1)', margin: '2px 0', ...style }} />
);

const Input = ({ placeholder, multiline = false, style = {} }) => (
  multiline
    ? <div className="input-field" style={{ minHeight: 60, color:'var(--text3)', ...style }}>{placeholder}</div>
    : <div className="input-field" style={{ color:'var(--text3)', ...style }}>{placeholder}</div>
);

const CamPill = ({ label, active }) => (
  <div className={active ? 'btn btn-cam' : 'btn btn-cam-inactive'}>{label}</div>
);

const Transport = () => (
  <div className="transport">
    <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><polygon points="3,2 3,10 0,10 0,2" fill="rgba(240,232,224,0.4)"/><polygon points="3,6 10,2 10,10" fill="rgba(240,232,224,0.4)"/></svg>
    <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><polygon points="6,2 12,6 6,10" fill="rgba(240,232,224,0.5)"/></svg>
    <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><polygon points="0,2 6,6 0,10" fill="rgba(240,232,224,0.4)"/><polygon points="7,2 9,2 9,10 7,10" fill="rgba(240,232,224,0.4)"/></svg>
    <div className="transport-track">
      <div className="transport-fill" style={{ width:'28%' }} />
      <div className="transport-head" style={{ left:'28%' }} />
    </div>
    <Txt c="var(--text3)" s={10}>00:17 / 01:15</Txt>
    <svg width="12" height="12" viewBox="0 0 12 12" fill="none" style={{opacity:0.4}}><path d="M1 8 Q3 4 6 6 Q9 8 11 4" stroke="white" strokeWidth="1.5" fill="none"/></svg>
    <svg width="13" height="13" viewBox="0 0 13 13" fill="none" style={{opacity:0.4}}><rect x="1" y="1" width="11" height="11" rx="2" stroke="white" strokeWidth="1.2"/><rect x="4" y="4" width="5" height="5" fill="white" opacity="0.6"/></svg>
  </div>
);

const Avatar = ({ initials, size = 24 }) => (
  <div className="avatar" style={{ width: size, height: size }}>{initials}</div>
);

const StageBase = ({ children, dimmed = false }) => (
  <div className="stage-viewer" style={{ opacity: dimmed ? 0.85 : 1 }}>
    <div className="stage-grid" />
    {/* Perspective stage lines */}
    <svg style={{ position:'absolute', inset:0, width:'100%', height:'100%', opacity: 0.22 }}
      viewBox="0 0 700 420" preserveAspectRatio="xMidYMid slice">
      {[0,1,2,3,4,5,6,7].map(i => (
        <line key={i} x1={350} y1={200} x2={i * 100} y2={420} stroke="#E8531A" strokeWidth="0.6" />
      ))}
      {[0,1,2,3,4].map(i => (
        <line key={i} x1={0} y1={420 - i*60} x2={700} y2={420 - i*60} stroke="#E8531A" strokeWidth="0.4" />
      ))}
      <ellipse cx="350" cy="300" rx="200" ry="75" stroke="#E8531A" strokeWidth="0.8" fill="none" strokeDasharray="5 4" opacity="0.6"/>
      <rect x="150" y="160" width="400" height="180" stroke="#E8531A" strokeWidth="0.8" fill="none" strokeDasharray="4 3" opacity="0.5"/>
      <rect x="240" y="185" width="90" height="130" stroke="#E8531A" strokeWidth="0.7" fill="rgba(232,83,26,0.03)" opacity="0.7"/>
      <rect x="370" y="185" width="90" height="130" stroke="#E8531A" strokeWidth="0.7" fill="rgba(232,83,26,0.03)" opacity="0.7"/>
      <line x1="285" y1="160" x2="285" y2="320" stroke="#E8531A" strokeWidth="0.5" strokeDasharray="3 3" opacity="0.4"/>
      <line x1="415" y1="160" x2="415" y2="320" stroke="#E8531A" strokeWidth="0.5" strokeDasharray="3 3" opacity="0.4"/>
    </svg>
    {/* Subtle vignette */}
    <div style={{ position:'absolute', inset:0, background:'radial-gradient(ellipse 80% 80% at 50% 50%, transparent 40%, rgba(5,3,2,0.6) 100%)', pointerEvents:'none' }} />
    <div className="stage-label-overlay" style={{ top:10, left:12 }}>
      <span style={{ color:'var(--cam)', background:'rgba(26,143,227,0.12)', border:'1px solid rgba(26,143,227,0.3)', borderRadius:4, padding:'2px 7px', fontSize:9, letterSpacing:'0.08em' }}>● CAM: FOH</span>
    </div>
    <div className="stage-label-overlay" style={{ bottom:10, left:12, color:'rgba(240,232,224,0.18)', fontSize:8 }}>
      3D STAGE VIEWER — PREVIZ ENGINE
    </div>
    {children}
  </div>
);

const ClipItem = ({ index, label, time, active, feedbacks }) => (
  <div style={{
    display:'flex', gap:8, alignItems:'center',
    padding:'5px 8px', borderRadius:8, cursor:'default',
    background: active ? 'rgba(232,83,26,0.07)' : 'transparent',
    borderLeft: `2px solid ${active ? 'var(--ember)' : 'transparent'}`,
    boxShadow: active ? '0 0 10px rgba(232,83,26,0.08)' : 'none',
  }}>
    <div className={`clip-thumb ${active?'active':''}`} style={{ width:48, height:30 }}>
      <div className="clip-thumb-bg" />
      {active && <div style={{ position:'absolute', bottom:2, right:3, width:6, height:6, borderRadius:'50%', background:'var(--ember)', boxShadow:'0 0 5px rgba(232,83,26,0.8)' }} />}
    </div>
    <C gap={1} style={{ flex:1, minWidth:0 }}>
      <Txt s={11} w={active?600:400} c={active?'var(--text)':'var(--text2)'}
        style={{ overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{label}</Txt>
      <Txt s={9} c="var(--text3)">{time}</Txt>
    </C>
    <C gap={2} style={{ alignItems:'flex-end' }}>
      <Txt s={9} c="var(--text3)">#{index}</Txt>
      {feedbacks > 0 && (
        <div style={{ background:'var(--amber)', borderRadius:8, padding:'1px 5px', fontSize:8, color:'#1a0a00', fontWeight:700 }}>{feedbacks}</div>
      )}
    </C>
  </div>
);

const RefImg = ({ label, w=68, h=46 }) => (
  <C gap={3} style={{ flexShrink:0 }}>
    <div className="ref-img-block" style={{ width:w, height:h }}>
      <div className="hatch" />
      <Txt s={8} c="var(--text3)" style={{ position:'relative', zIndex:1 }}>ref img</Txt>
    </div>
    <Txt s={9} c="var(--text3)" style={{ maxWidth:w, textAlign:'center', display:'block' }}>{label}</Txt>
  </C>
);

const FeedbackItem = ({ author, text, status, time, clip, onResolve }) => (
  <div className="feedback-item">
    <R gap={6} style={{ marginBottom:4 }}>
      <Avatar initials={author[0]} size={18} />
      <Txt s={10} w={600}>{author}</Txt>
      {clip && <Txt s={9} c="var(--text3)">· {clip}</Txt>}
      <Tag type={status}>{status}</Tag>
      <Sp f={1} />
      <Txt s={9} c="var(--text3)">{time}</Txt>
    </R>
    <Txt s={10} c="var(--text2)" style={{ display:'block', paddingLeft:24, lineHeight:1.5 }}>{text}</Txt>
    {onResolve && (
      <R gap={6} style={{ marginTop:5, paddingLeft:24 }}>
        <div className="btn btn-ghost" style={{ padding:'2px 7px', fontSize:9 }}>Resolve</div>
        <div className="btn btn-ghost" style={{ padding:'2px 7px', fontSize:9 }}>Add note</div>
      </R>
    )}
  </div>
);

/* ─── SCREEN 1: ADMIN EDITOR ─── */
const AdminScreen = () => {
  const [rightTab, setRightTab] = useState('context');
  return (
  <div className="screen" style={{ width:980, height:640, display:'flex', flexDirection:'column' }}>
    {/* Topbar */}
    <div className="topbar">
      <div className="logo-mark">SV</div>
      <Txt s={13} w={700}>StageViz</Txt>
      <div className="topbar-divider" />
      <Txt s={11} c="var(--text2)">Coachella 2026 — Main Stage</Txt>
      <Tag type="unsaved">● Unsaved</Tag>
      <Sp f={1} />
      <Txt s={9} c="var(--text3)">v3 · 2h ago</Txt>
      <Btn v="ghost"><svg width="11" height="11" viewBox="0 0 11 11" fill="none"><circle cx="5.5" cy="5.5" r="4.5" stroke="currentColor" strokeWidth="1.2"/><path d="M5.5 3v3l2 1.5" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round"/></svg> Preview</Btn>
      <Btn v="ember">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M5 1 L9 5 L5 9 M1 5 H9" stroke="white" strokeWidth="1.4" strokeLinecap="round"/></svg>
        Publish
      </Btn>
    </div>

    {/* Body */}
    <div style={{ flex:1, display:'flex', overflow:'hidden' }}>
      {/* LEFT PANEL — Clip sequence */}
      <div className="glass-panel" style={{ width:168, borderRadius:0, borderTop:'none', borderLeft:'none', borderBottom:'none', display:'flex', flexDirection:'column' }}>
        <div className="panel-header">
          <R gap={6}>
            <SLabel>Clips / Slides</SLabel>
            <Sp f={1} />
            <div className="btn btn-ghost" style={{ padding:'2px 6px', fontSize:10 }}>＋</div>
          </R>
        </div>
        <div style={{ flex:1, overflowY:'auto', padding:'6px 4px' }}>
          <ClipItem index={1} label="Intro Logo Reveal" time="0:42" active feedbacks={2} />
          <ClipItem index={2} label="Act 1 — Main Stage" time="1:15" feedbacks={1} />
          <ClipItem index={3} label="LED Wall Test A" time="0:28" feedbacks={0} />
          <ClipItem index={4} label="Confetti Burst" time="0:20" feedbacks={0} />
          <ClipItem index={5} label="Outro Flythrough" time="1:03" feedbacks={0} />
        </div>
